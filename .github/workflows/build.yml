name: Build site

# Tests run on every pull request and push. The site is rebuilt:
#   - every morning, with fresh data. GitHub's cron is in UTC: 08:17 UTC is 09:17 BST / 08:17 GMT.
#     That's after Google Books' daily quota resets at midnight Pacific (08:00 UK time), so each
#     run starts with a fresh quota;
#   - on every push to main (e.g. a picks.yaml edit), reusing the morning's data;
#   - by hand from the Actions tab ("Run workflow"), with or without fresh data.
# Deploying is off until the repository variable DEPLOY_ENABLED is set to "true".

on:
  schedule:
    - cron: "17 8 * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fetch:
        description: "Fetch fresh data (untick to rebuild from the last run's data)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fetch) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .

      # .cache holds the last run's releases (the fallback if a source fails) and the
      # MusicBrainz artist genres, so each run only looks up new artists.
      - name: Restore last run's data
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: brandnew-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: brandnew-data-

      - name: Fetch releases
        id: fetch
        if: env.FRESH == 'true' || hashFiles('.cache/releases.json') == ''
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
        run: python -m brandnew fetch --previous .cache/releases.json

      - name: Save data for the next run
        if: always() && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: brandnew-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build site
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}  # for looking up picks
        run: python -m brandnew build --min-releases 50

      - name: Summary
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import collections, json
          from brandnew import config
          from brandnew.ukdates import format_updated
          from datetime import datetime
          d = json.load(open(".cache/releases.json", encoding="utf-8"))
          rs = d["releases"]
          count = collections.Counter((r["kind"], g) for r in rs for g in r["genres"])
          print(f"### Data from {format_updated(datetime.fromisoformat(d['generated']))}\n")
          print("| Genre | Releases |\n|---|---|")
          for g in config.ALL_GENRES:
              print(f"| {config.KIND_NAMES[g.kind]}: {g.name} | {count[(g.kind, g.slug)]} |")
          EOF

      - name: Keep the built site for a week
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

      - name: Deploy to Azure Static Web Apps
        if: vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
