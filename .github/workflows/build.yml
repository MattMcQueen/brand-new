name: Build site

# Tests run on every pull request and push. The site is rebuilt:
#   - once a day, with fresh data. GitHub's scheduled runs are best-effort (late, sometimes
#     dropped), so there are three slots: 09:17, 11:47 and 15:17 BST (an hour earlier in GMT;
#     cron is in UTC). All are after Google Books' daily quota resets at midnight Pacific
#     (08:00 UK time). The "due" job stops a slot early when the live site already has today's
#     data, so a later slot only does the work when an earlier one failed or never ran;
#   - on every push to main, reusing the morning's data;
#   - by hand from the Actions tab ("Run workflow"), with or without fresh data.
# Deploying is off until the repository variable DEPLOY_ENABLED is set to "true".

on:
  schedule:
    - cron: "17 8 * * *"
    - cron: "47 10 * * *"
    - cron: "17 14 * * *"
    # TEMPORARY (26 Sept 2026): every 15 minutes, to test whether GitHub fires this schedule at all.
    # Each run stops in the "due" job, since today's data is already live. Remove after the test.
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fetch:
        description: "Fetch fresh data (untick to rebuild from the last run's data)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Every job names its Ubuntu version rather than ubuntu-latest, which moves to Ubuntu 26 from
# 19 October 2026: moving to a new version is then a change made on purpose, not a surprise.
jobs:
  # Scheduled runs only: is today's data already live? Anything else always runs. If the live
  # data can't be read (site down, bad JSON), the run goes ahead.
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          DATA_URL: https://brand-new.matt-rarely-writes.co.uk/data/releases.json
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          live=$(curl -fsS --max-time 30 "$DATA_URL?t=$(date +%s)" | python3 -c '
          import json, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.fromisoformat(json.load(sys.stdin)["generated"]).astimezone(ZoneInfo("Europe/London")).date())
          ' || true)
          today=$(TZ=Europe/London date +%F)
          if [ "$live" = "$today" ]; then
            echo "::notice title=Already refreshed::The live site already has today's data ($live), so this slot is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Live data is from ${live:-unknown}, today is $today: refreshing."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fetch) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .

      # .cache holds the last run's releases (the fallback if a source fails) and the
      # MusicBrainz artist genres, so each run only looks up new artists.
      - name: Restore last run's data
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: brandnew-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: brandnew-data-

      - name: Fetch releases
        id: fetch
        if: env.FRESH == 'true' || hashFiles('.cache/releases.json') == ''
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
        run: python -m brandnew fetch --previous .cache/releases.json

      - name: Save data for the next run
        if: always() && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: brandnew-data-${{ github.run_id }}-${{ github.run_attempt }}

      # Too few releases (a bad data day) isn't an error: the site just isn't rebuilt, so the live
      # site keeps its last good version. Exit code 3 means exactly that; anything else still fails.
      - name: Build site
        id: build
        run: |
          set +e
          python -m brandnew build --min-releases 50
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            echo "::warning title=Site not rebuilt::Too few releases in the data, so the site was left as it was. The next fresh fetch should fix it."
          else
            exit "$code"
          fi

      - name: Summary
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import collections, json
          from brandnew import config
          from brandnew.ukdates import format_updated
          from datetime import datetime
          d = json.load(open(".cache/releases.json", encoding="utf-8"))
          rs = d["releases"]
          count = collections.Counter((r["kind"], g) for r in rs for g in r["genres"])
          print(f"### Data from {format_updated(datetime.fromisoformat(d['generated']))}\n")
          print("| Genre | Releases |\n|---|---|")
          for g in config.ALL_GENRES:
              print(f"| {config.KIND_NAMES[g.kind]}: {g.name} | {count[(g.kind, g.slug)]} |")
          EOF

      - name: Keep the built site for a week
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

      - name: Deploy to Azure Static Web Apps
        if: steps.build.outputs.built == 'true' && vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
