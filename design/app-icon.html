<!doctype html>
<!-- Source for the home-screen icons (brandnew/static/icon-180.png, icon-192.png, icon-512.png).
     The sticker on the site's cream background, with room around it so Android's round or squircle
     masks don't clip the points. Regenerate with Microsoft Edge, from the repo root. Edge won't open a
     window smaller than about 500px, so always use a 512px window and scale it: for size N, pass
     --force-device-scale-factor=N/512 (e.g. 0.3515625 for 180, 0.375 for 192, 1 for 512):
     "C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" --headless --disable-gpu --hide-scrollbars
       --window-size=512,512 --force-device-scale-factor=0.3515625
       --screenshot="%CD%/brandnew/static/icon-180.png" "file:///%CD%/design/app-icon.html" -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #faf7f2; }

</head>
